services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: real_time_chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat-local-only
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d real_time_chat"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: .
    working_dir: /app
    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    env_file: .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: real_time_chat
      DB_USER: chat
      DB_PASSWORD: chat-local-only
      DB_HOST: db
      DB_PORT: 5432
      USE_REDIS_CHANNEL_LAYER: 1
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,web
    volumes: [".:/app"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://web:8000
    volumes: ["./frontend:/app"]
    ports: ["5173:5173"]
    depends_on: [web]
volumes:
  postgres_data:
