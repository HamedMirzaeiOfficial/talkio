# Local development stack. Credentials are placeholders for local use only.
#   cp .env.example .env && docker compose up --build
# Web: http://localhost:4801  ·  API: http://localhost:4800/api/health/
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talkio
      POSTGRES_USER: talkio
      POSTGRES_PASSWORD: talkio-local-only
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U talkio -d talkio']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    env_file: .env
    environment:
      DEBUG: '1'
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: talkio
      DB_USER: talkio
      DB_PASSWORD: talkio-local-only
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,server
      CSRF_TRUSTED_ORIGINS: http://localhost:4801,http://127.0.0.1:4801
    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    ports: ['127.0.0.1:4800:8000']
    volumes:
      - ./apps/server:/app/apps/server
      - ./packages/django-chat:/app/packages/django-chat
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    image: node:22-alpine
    working_dir: /repo
    command: sh -c "npm ci && npm run build:packages && npm run dev -w @talkio/web -- --host 0.0.0.0"
    environment:
      TALKIO_API_TARGET: http://server:8000
    ports: ['127.0.0.1:4801:4801']
    volumes:
      - .:/repo
      - node_modules:/repo/node_modules
    depends_on: [server]

volumes:
  postgres_data:
  node_modules:
