<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Talkio">
  <defs>
    <linearGradient id="tile" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D6BF5"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#tile)"/>
  <!-- speech bubble with a tail toward the lower left -->
  <path fill="#fff" d="M14 27.5C14 19.5 20.5 13 28.5 13h7C43.5 13 50 19.5 50 27.5S43.5 42 35.5 42H28l-8.2 6.6c-1.3 1-3.1.1-3.1-1.5v-7.4A14.4 14.4 0 0 1 14 27.5Z"/>
  <!-- voice waveform inside the bubble -->
  <g fill="#4F46E5">
    <rect x="22.5" y="24" width="4" height="7" rx="2"/>
    <rect x="29.5" y="19.5" width="4" height="16" rx="2"/>
    <rect x="36.5" y="22.5" width="4" height="10" rx="2"/>
  </g>
  <!-- live / presence dot -->
  <circle cx="50" cy="14" r="6.5" fill="#34D399" stroke="url(#tile)" stroke-width="3.5"/>
</svg>
