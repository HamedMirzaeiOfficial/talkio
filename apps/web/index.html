<!doctype html>
<html lang="en" class="rc-tokens">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f1117" />
    <meta
      name="description"
      content="Talkio — real-time messaging built on reusable Django and React packages."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Talkio</title>
    <script>
      // Language and direction before first paint: the saved choice, else the browser's language.
      (function () {
        var l = 'en';
        try {
          var s = localStorage.getItem('talkio:lang');
          if (s === 'fa' || s === 'en') l = s;
          else if (/^fa\b/i.test((navigator.languages && navigator.languages[0]) || navigator.language || ''))
            l = 'fa';
        } catch (e) {}
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
      })();
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('talkio:preferences') || '{}').theme || 'dark';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.rcTheme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.rcTheme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
